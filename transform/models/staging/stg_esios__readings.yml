version: 2

models:
  - name: stg_esios__readings
    description: "Cleaned and typed readings from ESIOS API. One row per indicator per hour per geographic zone."
    columns:
      - name: _dlt_id
        description: "Unique row identifier generated by DLT"
        tests:
          - unique
          - not_null

      - name: indicator_id
        description: "Numeric ID of the ESIOS indicator"
        tests:
          - not_null
          - accepted_values:
              values: [1293, 460, 541, 544, 1775, 1776, 1777, 1778]
              quote: false

      - name: ts_utc
        description: "Timestamp of the reading in UTC"
        tests:
          - not_null

      - name: value_mw
        description: "Numeric value of the reading in MW or mEUR/MWh"
        tests:
          - not_null

      - name: geo_id
        description: "Geographic zone ID"
        tests:
          - not_null
          - accepted_values:
              values: [8741]
              quote: false